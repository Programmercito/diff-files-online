<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
  <defs>
    <!-- Rose/Pink Gradient for Original/Deleted File -->
    <linearGradient id="deleteGrad" x1="16" y1="16" x2="72" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Emerald/Cyan Gradient for Modified/Added File -->
    <linearGradient id="addGrad" x1="56" y1="32" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Subtle Shadows for depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- LEFT FILE (Original / Deletion) -->
  <g filter="url(#dropShadow)">
    <!-- Document Body -->
    <rect x="16" y="16" width="56" height="80" rx="10" fill="#161b22" stroke="url(#deleteGrad)" stroke-width="5" />
    
    <!-- Code Lines (Placeholder lines) -->
    <line x1="28" y1="34" x2="52" y2="34" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="46" x2="60" y2="46" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    
    <!-- Deleted Line (Red Highlighted) -->
    <rect x="24" y="54" width="40" height="10" rx="3" fill="#ffebe9" fill-opacity="0.15" />
    <line x1="28" y1="59" x2="56" y2="59" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
    
    <line x1="28" y1="72" x2="48" y2="72" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    <line x1="28" y1="84" x2="54" y2="84" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- RIGHT FILE (Modified / Addition) -->
  <g filter="url(#dropShadow)">
    <!-- Document Body -->
    <rect x="56" y="32" width="56" height="80" rx="10" fill="#0d1117" stroke="url(#addGrad)" stroke-width="5" />
    
    <!-- Code Lines (Placeholder lines) -->
    <line x1="68" y1="50" x2="92" y2="50" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    
    <!-- Added Line (Green Highlighted) -->
    <rect x="64" y="58" width="40" height="10" rx="3" fill="#e6ffec" fill-opacity="0.15" />
    <line x1="68" y1="63" x2="100" y2="63" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    
    <line x1="68" y1="76" x2="88" y2="76" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="88" x2="96" y2="88" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
    <line x1="68" y1="100" x2="84" y2="100" stroke="#484f58" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
